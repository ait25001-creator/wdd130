<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        #main-section {
            background-image: url('images/christus.webp');

            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            border: 5px solid black;
            border-radius: 10px;  
            margin-left: auto;
            margin-right: auto;
        }
        
        
        body {
            background: #E9F0F5;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            font-family: Helvetica, Arial, sans-serif;
            padding: 20px;
        }
        
        
        img {
            width: 100%;
            height: auto;
            border-radius: 50%;
            border: 5px solid white;
        }

        #h1 {
            color: #FFFFFE;
            font-size: 40px;
            text-align: center;
        }

        #h2 {
            color: #FFFFFE;
            font-size: 30px;
            text-align: center;
        }

        #first-presidency {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            justify-items: center;
        }

        #quorum {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
            justify-items: center;
        }

    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
    <div id="main-section">

    <h1>First Presidency</h1>

    <div id="first-presidency">
        <img src="images/eyring.webp" alt="Eyring">
        <img src="images/oaks.webp" alt="Oaks">
        <img src="images/christofferson.webp" alt="Christofferson">
        <img src="images/uchtdorf.webp" alt="Uchtdorf">
    </div>

    <h2>Quorum of the Twelve</h2>

    <div id="quorum">
        <img src="images/bednar.webp" alt="Bednar">
        <img src="images/cook.webp" alt="Cook">
        <img src="images/anderson.webp" alt="Anderson">
        <img src="images/renlund.webp" alt="Renlund">
        <img src="images/gong.webp" alt="Gong">
        <img src="images/soares.webp" alt="Soares">
        <img src="images/kearon.webp" alt="Kearon">
        <img src="images/gilbert.webp" alt="Gilbert">
        <img src="images/causse.webp" alt="Causse">
    </div>

</div>
