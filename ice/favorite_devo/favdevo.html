<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
  <tr>
    <th>Speaker</th>
    <th>Title</th>
    <th>Location</th>
    <th>Year</th>
  </tr>
  <tr>
    <td>Dallas Jenkins</td>
    <td>Five Loaves and Two Fishes</td>
    <td>Provo, Utah</td>
    <td>2024</td>
  </tr>
  <tr>
    <td>Jeffrey R. Holland</td>
    <td>Remember Lot's Wife</td>
    <td>Provo, Utah</td>
    <td>2009</td>
  </tr>
  <tr>
    <td>Jeffrey R. Holland</td>
    <td>Terror, Triumph, and a Wedding Feast</td>
    <td>Provo, Utah</td>
    <td>2004</td>
  </tr>
</table>
    
<form>
      <label for="speaker-name">Speaker: </label>
      <input type="text" id="speaker-name" name="speaker-name">
      
      <label for="title">Title: </label>
      <input type="text" id="title" name="title" required>
      
      <label for="location">Location: </label>
      <input type="text" id="location" name="location" required>
      
      <label for="year">Year: </label>
      <input type="text" id="year" name="year">

      <input type="Submit" value="Submit">

    </form>
      </div>
    </main>
  </div>
</body>
</html>
