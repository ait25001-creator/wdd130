<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        #card {
            background-color: #008DB1;
            border: 2px solid #004E63;
            width: 400px;
            border-radius: 10px;
            grid-column: 2 / 3;
        }


        body {
            background: #FFECD7;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
        }

        #h1 {
            color: #FFFFFE;
            font: Helvetica;
            font-size: 50px;
            text-align: center; 
        }

        #p {
            color: #FFFFFE;
            text-align: center;
            font-size: 40px;
            font: Helvetica; 
        }

        #ul {
            color: #FFFFFE;
            font: Helvetica; 
            margin-left: 10px;
            margin-right: 10px
        }

        #quote {
            color: #FFD783;
            text-align: left;
            font-size: 15px;
            font: 'Nanum Brush Script';
            margin-left: 10px;
            margin-right: 10px;  
        }
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
    <div id="card">
    <h1>Dallin H. Oaks</h1>
    <p>18th President of The Church of Jesus Christ of Latter-day Saints</p>
    <img src="images/oaks.webp" alt="Dallin H Oaks Portrait">
    <ul>
        <li>Born: August 12, 1932</li>
        <li>Apostle: Apr 7, 1984</li>
        <li>Prophet: Oct 14, 2025</li>
    </ul>

    <p id="quote">
        "Adversities are temporary. What is permanent is what we become by the way we react to them."
    </p>
    </div>
    
</body>
</body>
</html>
