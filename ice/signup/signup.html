
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            font-family: "Times New Roman", serif;
        }

        #formContainer {
            width: 420px;
            margin: 17px auto;
            background-color: white;
            border: 10px solid #082b7a;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }

        .banner {
            height: 230px;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            display: grid;
            place-items: center;
            text-align: center;
            color: white; 
            text-shadow: 2px 2px 3px black;
        }

        .banner h1 {
            font-size: 34px;
            line-height: 1.2;
        }

        .banner h2 {
            font-size: 27px;
        }

        #closeBtn {
            position: absolute;
            top: 12px;
            left: 14px;
            padding: 3px 9px;
            font-size: 18px;
            cursor: pointer;
            z-index: 2;
        }

        #formContainer h3 {
            text-align: center;
            font-size: 18px;
            margin: 20px 0;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 15px;
            row-gap: 20px;
            padding: 0 20px 20px;
            align-items: center;
        }

        #myForm > label {
            font-size: 16px;
        }

        #myForm > input {
            width: 100%;
            height: 22px;
        }

        #myForm > div {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #myForm > section {
            grid-column: 1 / 3;
            text-align: center;
        }

        #myForm > section button {
            padding: 3px 8px;
            cursor: pointer;
        }
        
        .scriptures {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background-color: white;
        }

        .scriptures img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        #output {
            max-width: 420px;
            margin: 20px auto;
            color: black;
            line-height: 1.6;
        }

        /* Mobile screens */
        @media (max-width: 450px) {
            #formContainer {
                width: 95%;
            }

            #myForm {
                column-gap: 10px;
                padding: 0 15px 20px;
            }

            .banner h1 {
                font-size: 30px;
            }

            .banner h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div id="formContainer">

        <button type="button" id="closeBtn">X</button>

        <div class="banner">
            <div>
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>
        </div>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <label for="username">User Name:</label>
            <input type="text" id="username"
                   name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password"
                   name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email"
                   name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male"
                       name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female"
                       name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter"
                       name="newsletter">
                <label for="newsletter">
                    Subscribe to newsletter
                </label>
            </section>

            <section>
                <input type="checkbox" id="conditions"
                       name="conditions" required>
                <label for="conditions">
                    I acknowledge the terms and conditions
                </label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>

        </form>

        <!-- Scripture images -->
        <div class="scriptures">

            <img src="images/old_testament.webp"
                 alt="Old Testament">

            <img src="images/new_testament.webp"
                 alt="New Testament">

            <img src="images/book_of_mormon.webp"
                 alt="Book of Mormon">

            <img src="images/doctrine_and_covenants.webp"
                 alt="Doctrine and Covenants">

            <img src="images/pearl_of_great_price.webp"
                 alt="Pearl of Great Price">

        </div>

    </div>

    <div id="output"></div>

    <script>
        // Close the signup form
        document.getElementById("closeBtn").addEventListener(
            "click",
            function () {
                document.getElementById("formContainer")
                    .style.display = "none";
            }
        );

        const form = document.getElementById("myForm");
        const output = document.getElementById("output");

        // Display submitted form information
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key === "password") {
                    entries.push(
                        `<strong>${key}</strong>: [hidden for security]`
                    );
                } else {
                    entries.push(
                        `<strong>${key}</strong>: ${value}`
                    );
                }
            }

            output.innerHTML = `
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join("")}
                </ul>
            `;
        });
    </script>

</body>
</html>
